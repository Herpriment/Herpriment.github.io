<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title data-i18n="page_destinos_title">Destinos - Puno Digital</title>
  <meta property="og:title" content="Destinos - Puno Digital">
  <meta property="og:description" content="Lista de destinos turísticos en Puno: Lago Titicaca, Uros, Taquile, Amantaní, Sillustani y más.">
  <meta property="og:image" content="../images/Destinos/Lago Titicaca.jpg">
  <link rel="stylesheet" href="../css/variables.css">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700&family=Quicksand:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
</head>
<body data-page="destinos">
  <header class="sticky-top bg-white shadow-sm">
    <nav class="navbar navbar-expand-lg navbar-light container py-3">
      <a class="navbar-brand fw-bold text-primary" href="../index.html">Puno Digital</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav" aria-controls="mainNav" aria-expanded="false" aria-label="Abrir menú">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="mainNav">
        <ul class="navbar-nav ms-auto align-items-lg-center">
          <li class="nav-item"><a class="nav-link" href="destinos.html" data-i18n="nav_destinos">Destinos</a></li>
          <li class="nav-item"><a class="nav-link" href="cultura.html" data-i18n="nav_cultura">Cultura</a></li>
          <li class="nav-item"><a class="nav-link" href="gastronomia.html" data-i18n="nav_gastronomia">Gastronomía</a></li>
          <li class="nav-item"><a class="nav-link" href="pueblos.html" data-i18n="nav_pueblos">Pueblos</a></li>
          <li class="nav-item"><a class="nav-link" href="itinerario.html" data-i18n="nav_itinerario">Itinerario</a></li>
        </ul>
        <button id="themeToggle" class="btn btn-outline-primary ms-3" type="button">Modo oscuro</button>
      </div>
    </nav>
  </header>
  <main class="container py-5">
    <h1 class="section-title" data-i18n="page_destinos_title">Destinos en Puno</h1>
    <p class="text-muted" data-i18n="page_destinos_subtitle">Selecciona y filtra los sitios sugeridos para visitar.</p>
    <!-- Carousel de imágenes -->
    <div id="destinosCarousel" class="carousel slide mb-4" data-bs-ride="carousel">
      <div class="carousel-inner">
        <div class="carousel-item active">
          <img src="../images/Destinos/Sillustani.jpeg" class="d-block w-100 rounded" alt="Sillustani">
        </div>
      </div>
      <button class="carousel-control-prev" type="button" data-bs-target="#destinosCarousel" data-bs-slide="prev">
        <span class="carousel-control-prev-icon" aria-hidden="true"></span>
        <span class="visually-hidden" data-i18n="carousel_prev">Anterior</span>
      </button>
      <button class="carousel-control-next" type="button" data-bs-target="#destinosCarousel" data-bs-slide="next">
        <span class="carousel-control-next-icon" aria-hidden="true"></span>
        <span class="visually-hidden" data-i18n="carousel_next">Siguiente</span>
      </button>
    </div>
    <div id="destinoFilters" class="mb-3"></div>
    <div id="destinoContainer" class="row g-4"></div>
    <h2 class="mt-5" data-i18n="map_title">Mapa</h2>
    <div id="map"></div>

    <!-- Modal detalle de destino -->
    <div class="modal fade" id="destinoModal" tabindex="-1" aria-hidden="true">
      <div class="modal-dialog modal-lg modal-dialog-centered">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title" id="destinoModalLabel">Destino</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
          </div>
          <div class="modal-body">
            <img id="destinoModalImage" src="" alt="" class="img-fluid mb-3 rounded">
            <ul class="nav nav-tabs" id="destinoTab" role="tablist">
              <li class="nav-item" role="presentation">
                <button class="nav-link active" id="resumen-tab" data-bs-toggle="tab" data-bs-target="#resumen" type="button" role="tab" data-i18n="tab_resumen">Resumen</button>
              </li>
              <li class="nav-item" role="presentation">
                  <button class="nav-link" id="historia-tab" data-bs-toggle="tab" data-bs-target="#historia" type="button" role="tab" data-i18n="tab_historia">Historia</button>
              </li>
              <li class="nav-item" role="presentation">
                  <button class="nav-link" id="reco-tab" data-bs-toggle="tab" data-bs-target="#recomendaciones" type="button" role="tab" data-i18n="tab_recomendaciones">Recomendaciones</button>
              </li>
            </ul>
            <div class="tab-content mt-3">
              <div class="tab-pane fade show active" id="resumen" role="tabpanel"></div>
              <div class="tab-pane fade" id="historia" role="tabpanel"></div>
              <div class="tab-pane fade" id="recomendaciones" role="tabpanel"></div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </main>

  <footer class="bg-dark text-white py-4">
    <div class="container d-flex flex-column flex-md-row justify-content-between align-items-center">
      <div>© 2026 Puno Digital. Todos los derechos reservados.</div>
      <div>
        <a href="#" class="text-white me-3">Facebook</a>
        <a href="#" class="text-white me-3">Instagram</a>
        <a href="#" class="text-white">Twitter</a>
      </div>
      <div>Universidad Nacional del Altiplano - Puno</div>
    </div>
  </footer>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="../js/script.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
